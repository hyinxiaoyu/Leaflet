# Leaflet Gradle properties.
#
# JDK 17 is REQUIRED to run the Gradle daemon (AGP 8.13.x). Do NOT run the
# daemon on the machine-default JDK 25. This repo intentionally sets NO
# org.gradle.java.home so the build is portable across machines and CI:
# point JAVA_HOME at a local JDK 17 before invoking Gradle, e.g.
#   export JAVA_HOME=/path/to/jdk-17
# (or set org.gradle.java.home in ~/.gradle/gradle.properties, which is
# user-local and never committed). Compilation itself is pinned via
# kotlin jvmToolchain(17) in each module.

# android.useAndroidX opts the build into AndroidX artifacts (instead of the
# legacy Support Library). All Leaflet dependencies are AndroidX.
android.useAndroidX=true

org.gradle.caching=true
org.gradle.parallel=true
# Kotlin code style "official" keeps ktlint/Compose formatting consistent.
kotlin.code.style=official
# Non-transitive R classes keep feature modules decoupled from app resources.
android.nonTransitiveRClass=true
